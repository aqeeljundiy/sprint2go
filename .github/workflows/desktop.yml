# Builds the desktop app for Mac and Windows when a version tag is pushed (git tag v0.1.1 && git push --tags),
# and attaches the installers to a GitHub release of that tag, with the update files (latest.yml, latest-mac.yml and
# the blockmaps) that installed apps check to update themselves. The landing page's download links point at the
# latest release. A manual run (workflow_dispatch) only builds, and keeps the files as the run's artifacts.
name: Desktop app
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write # create the release and upload to it
jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      # The app's version is the tag's (v0.1.1 -> 0.1.1): installed apps compare it to know there's an update.
      - if: startsWith(github.ref, 'refs/tags/v')
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: npx electron-builder --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.exe
            desktop/release/*.yml
          if-no-files-found: ignore
