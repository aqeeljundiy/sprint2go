# Every push and pull request: both typechecks, the build, the demo-only guard, the unit checks, the calendar parser's
# tests and repeating events' tests, a mail smoke test (the server starts on a throwaway data folder and really receives mail over SMTP) and the
# security and billing checks (who may see and change what, read-only companies, plan limits, signed webhooks, DKIM),
# the demo company and try-out checks (each person's demo company stays theirs and nothing in it leaves), the AI
# apps connector (sign-in with OAuth and PKCE, every MCP tool, each person sees only their own, outward things are drafts),
# the import checks (Slack, Trello and Google Drive into a company, Undo, and zips that try to get out or blow up),
# the Tables checks (filters with groups, each person's own filters and sorts, templates that repeat, who may change a view),
# phone mail apps (IMAP and SMTP submission with app passwords, against a real IMAP client and nodemailer), mail for
# teams (delegation, forwarding, groups and shared inboxes, data loss rules, legal hold, contacts, mbox, POP3), the Whitelist
# (Unlimited companies: every limit lifted, never billed, their own AI and Boosted monthly limits and people's rules), the
# phone design system check (the phone layer uses only the tokens) and the language check (every Indonesian text keeps the English one's placeholders).
name: CI
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Typecheck the app
        run: npx tsc -p tsconfig.json --noEmit
      - name: Typecheck the server
        run: npx tsc -p tsconfig.server.json --noEmit
      - name: Build
        run: npx vite build
      - name: Phone layer keeps to the design system (tokens, type roles, spacing, radii, rows; docs/mobile-kit.md)
        run: node scripts/ui-tokens-check.mjs
      - name: Demo-only code is guarded
        run: node scripts/check-demo-guards.mjs
      - name: Languages (Indonesian placeholders match the English, per area; docs/i18n.md)
        run: node scripts/i18n-check.mjs
      - name: Languages, finished areas (no English left, no conflicting words)
        run: node scripts/i18n-check.mjs --strict
      - name: Unit checks
        run: node --import ./server/register.mjs scripts/unit-tests.mjs
      - name: Calendar parser and repeating events (invites, calendar links, our own series)
        run: node --import ./server/register.mjs --test server/ics.test.ts server/repeat.test.ts
      - name: Mail smoke test
        run: node scripts/smoke-mail.mjs
      - name: Security and billing checks
        run: node scripts/security-tests.mjs
      - name: AI models (provider lists, picking, fallback)
        run: node scripts/ai-models-e2e.mjs
      - name: Demo company and try-out (kept apart, nothing leaves, /try)
        run: node scripts/sandbox-tests.mjs
      - name: AI apps connector (OAuth with PKCE, MCP tools, who sees what, drafts)
        run: node scripts/mcp-tests.mjs
      - name: Chat (following threads, group messages, who sees them, guests)
        run: node --import ./server/register.mjs scripts/chat-tests.mjs
      - name: Imports (Slack, Trello, Google Drive, Undo, hostile zips)
        run: node scripts/import-tests.mjs
      - name: Tables (filters, own filters and sorts, colour rules, templates, who may change a view)
        run: node --import ./server/register.mjs scripts/tables-tests.mjs
      - name: Phone mail apps (IMAP, SMTP submission, app passwords)
        run: node scripts/imap-tests.mjs
      - name: Mail for teams (delegation, forwarding, groups, data loss rules, legal hold and retention, contacts, mbox export and import, POP3, mail storage)
        run: node --import ./server/register.mjs scripts/mail-teams-tests.mjs
      - name: Whitelist (Unlimited lifts every limit, no invoices, AI and Boosted monthly limits, people's rules, operators only, audit, MRR)
        run: node --import ./server/register.mjs scripts/whitelist-tests.mjs
