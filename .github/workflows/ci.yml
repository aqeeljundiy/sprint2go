# Every push and pull request: both typechecks, the build, the demo-only guard, the unit checks, the calendar parser's
# tests, a mail smoke test (the server starts on a throwaway data folder and really receives mail over SMTP) and the
# security and billing checks (who may see and change what, read-only companies, plan limits, signed webhooks, DKIM),
# the demo company and try-out checks (each person's demo company stays theirs and nothing in it leaves), the AI
# apps connector (sign-in with OAuth and PKCE, every MCP tool, each person sees only their own, outward things are drafts),
# the import checks (Slack, Trello and Google Drive into a company, Undo, and zips that try to get out or blow up),
# the Tables checks (filters with groups, each person's own filters and sorts, templates that repeat, who may change a view)
# and phone mail apps (IMAP and SMTP submission with app passwords, against a real IMAP client and nodemailer).
name: CI
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Typecheck the app
        run: npx tsc -p tsconfig.json --noEmit
      - name: Typecheck the server
        run: npx tsc -p tsconfig.server.json --noEmit
      - name: Build
        run: npx vite build
      - name: Demo-only code is guarded
        run: node scripts/check-demo-guards.mjs
      - name: Unit checks
        run: node --import ./server/register.mjs scripts/unit-tests.mjs
      - name: Calendar parser (invites and calendar links)
        run: node --import ./server/register.mjs --test server/ics.test.ts
      - name: Mail smoke test
        run: node scripts/smoke-mail.mjs
      - name: Security and billing checks
        run: node scripts/security-tests.mjs
      - name: AI models (provider lists, picking, fallback)
        run: node scripts/ai-models-e2e.mjs
      - name: Demo company and try-out (kept apart, nothing leaves, /try)
        run: node scripts/sandbox-tests.mjs
      - name: AI apps connector (OAuth with PKCE, MCP tools, who sees what, drafts)
        run: node scripts/mcp-tests.mjs
      - name: Imports (Slack, Trello, Google Drive, Undo, hostile zips)
        run: node scripts/import-tests.mjs
      - name: Tables (filters, own filters and sorts, colour rules, templates, who may change a view)
        run: node --import ./server/register.mjs scripts/tables-tests.mjs
      - name: Phone mail apps (IMAP, SMTP submission, app passwords)
        run: node scripts/imap-tests.mjs
